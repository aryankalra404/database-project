services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sahvs
      POSTGRES_USER: sahvs
      POSTGRES_PASSWORD: sahvs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahvs -d sahvs"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://sahvs:sahvs@database:5432/sahvs
      EMBEDDING_PROVIDER: hash
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
